services:
  api:
    build:
      context: .
      dockerfile: TransPort.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TransPort: ${TRANSPORT_DB_CONNECTION}
      Jwt__Issuer: TransPort.Api
      Jwt__Audience: TransPort.Web
      Jwt__SigningKey: ${TRANSPORT_JWT_KEY}
      Jwt__ExpirationMinutes: 60
      AllowedOrigins__0: http://localhost:8080
    ports:
      - "8081:8080"
    networks:
      - transport-interna
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: TransPort.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseUrl: http://api:8080/
      DataProtection__KeysPath: /var/transport/keys
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks:
      - transport-interna
    volumes:
      - transport-web-keys:/var/transport/keys
    restart: unless-stopped

networks:
  transport-interna:
    driver: bridge

volumes:
  transport-web-keys:
